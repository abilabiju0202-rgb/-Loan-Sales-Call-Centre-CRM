
<!DOCTYPE html>
<html>
<head>
    <title>Daily Call Performance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h3>My Daily Performance</h3>
    <p class="text-muted">{{ target.target_date }}</p>

    <div class="card shadow-sm p-4">

        <h5>Daily Call Target</h5>

        <h2>{{ completed_calls }} / {{ target.call_target }}</h2>

        <div class="progress my-3" style="height:20px;">
            <div class="progress-bar bg-success"
                 role="progressbar"
                 style="width:{{ percentage }}%">
                {{ percentage }}%
            </div>
        </div>

        <div class="row text-center mt-3">

            <div class="col-6">
                <h4 class="text-success">{{ completed_calls }}</h4>
                <p>Completed Calls</p>
            </div>

            <div class="col-6">
                <h4 class="text-danger">{{ remaining_calls }}</h4>
                <p>Remaining Calls</p>
            </div>

        </div>

    </div>

    <a href="{% url 'call_centre' %}"
       class="btn btn-primary mt-3">Back to Call Centre</a>

</div>

</body>
</html>
